name: 打包 Windows 程式(給 mentor 用)

on:
  workflow_dispatch: {}          # 手動觸發:Actions 頁按 Run workflow
  push:
    branches: [ main ]
    paths: [ "app.py", "build_report.py", "extract*.py", "resolve.py", ".github/workflows/build-exe.yml" ]

jobs:
  build:
    runs-on: windows-latest      # 用 Windows 機器打包(打包不需連 TWSE)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝依賴
        run: pip install pdfplumber openpyxl requests pyinstaller
      - name: 打包成單一 exe
        run: pyinstaller --onefile --name 銀行債券報表 --collect-all pdfplumber --collect-all pdfminer app.py
      - name: 上傳 exe(可在此工作流程頁面下載)
        uses: actions/upload-artifact@v4
        with:
          name: 銀行債券報表-Windows
          path: dist/銀行債券報表.exe
