name: 打包程式(給 mentor:Windows / Mac)

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths: [ "app.py", "build_report.py", "extract*.py", "resolve.py", ".github/workflows/build-exe.yml" ]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pdfplumber openpyxl requests pyinstaller
      - run: pyinstaller --onefile --name bank-bond-report --collect-all pdfplumber --collect-all pdfminer app.py
      - uses: actions/upload-artifact@v4
        with:
          name: bank-bond-report-Windows
          path: dist/bank-bond-report.exe

  mac:
    runs-on: macos-13          # Intel x86_64:Apple 晶片與 Intel Mac 皆可跑(ARM 走 Rosetta)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pdfplumber openpyxl requests pyinstaller
      - run: pyinstaller --onefile --name bank-bond-report --collect-all pdfplumber --collect-all pdfminer app.py
      - name: 建立雙擊啟動器 + 打包(全英文檔名,避免解壓編碼問題)
        run: |
          cd dist
          cat > START-HERE.command <<'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          xattr -dr com.apple.quarantine . 2>/dev/null
          ./bank-bond-report
          EOF
          chmod +x START-HERE.command bank-bond-report
          zip -r bank-bond-report-Mac.zip bank-bond-report START-HERE.command
      - uses: actions/upload-artifact@v4
        with:
          name: bank-bond-report-Mac
          path: dist/bank-bond-report-Mac.zip
