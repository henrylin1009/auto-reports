name: 發佈網頁(GitHub Pages)

# 說明:TWSE 會擋 GitHub 雲端 IP,無法在 CI 直接抓財報。
# 因此資料在「本機」產好(build_report.py 產出 data.json + 完整報表.xlsx 並 commit),
# CI 只負責讀這兩個檔、畫圖、發佈網頁 —— 穩定不依賴 TWSE。
#
# 更新流程:本機跑 `python3 build_report.py` → git add data.json 銀行債券_完整報表.xlsx → push,
# 這個工作流程就會自動把新資料發佈上網。

on:
  push:
    branches: [ main ]
    paths: [ "data.json", "銀行債券_完整報表.xlsx", "make_web.py", ".github/workflows/report.yml" ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安裝中文字型(圖表用)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝依賴
        run: pip install matplotlib
      - name: 產出網頁(讀 data.json + xlsx)
        run: python3 make_web.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
