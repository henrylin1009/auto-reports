<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>v4 複核台</title>
<link rel="stylesheet" href="/tokens.css">
<style>
/* 沿用 workbench.html 的視覺語言,樣式表獨立——v4 是新頁面,不共用 v3 的 JS/DOM 假設。 */
:root{
  --bg:#f5f6f8; --panel:#fff; --panel2:#eef0f3; --line:#e9ebef;
  --fg:#111827; --dim:#5f6672; --mute:#8a919e;
  --ok:#15803d; --warn:#b45309; --accent:#4f46e5; --danger:#b91c1c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,"Noto Sans TC",sans-serif}
nav{display:flex;align-items:center;gap:2px;background:var(--panel);
  border-bottom:1px solid var(--line);padding:0 12px;position:sticky;top:0;z-index:10;
  overflow-x:auto}
nav a{padding:11px 16px;color:var(--dim);text-decoration:none;font-size:13px;
  border-bottom:2px solid transparent;white-space:nowrap;flex:none}
nav a.on{color:var(--fg);border-bottom-color:var(--accent)}
nav .sp{margin-left:auto;font-size:12px;color:var(--mute);padding-right:4px;white-space:nowrap}
main{padding:16px;max-width:1240px}
h1{font-size:17px;font-weight:500;margin:0 0 12px}
button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;font-size:13px;font-family:inherit;cursor:pointer}
button:hover{border-color:#c6cbd4}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.muted{color:var(--mute);font-size:12px}

.stats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:9px 16px;min-width:96px}
.stat b{display:block;font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--mute)}
.stat.red b{color:var(--danger)} .stat.grey b{color:var(--mute)} .stat.green b{color:var(--ok)}

table.q{width:100%;border-collapse:collapse;background:var(--panel);border-radius:10px;
  overflow:hidden;border:1px solid var(--line)}
table.q th{text-align:left;font-size:11px;font-weight:400;color:var(--dim);
  padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel2)}
table.q td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
table.q tr:last-child td{border-bottom:none}
table.q tr.row:hover{background:var(--panel2);cursor:pointer}
.badge{font-size:10px;padding:1px 7px;border-radius:10px;font-weight:500}
.badge.RED{background:#fdecec;color:var(--danger)}
.badge.GREY{background:var(--panel2);color:var(--mute)}
.badge.GREEN{background:#eafaf0;color:var(--ok)}
.badge.RATIFIED{background:#eef0fd;color:var(--accent)}
.diff{font-variant-numeric:tabular-nums;color:var(--danger)}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
.wl{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.w{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;
  border:1px solid var(--line);font-size:12px}
.w .name{min-width:120px;color:var(--dim)}
.w .st{font-weight:600}
.w.OK .st{color:var(--ok)} .w.MISMATCH .st{color:var(--danger)} .w.no_witness .st{color:var(--mute)}
.rows2{margin:8px 0}
.r2{display:flex;gap:8px;padding:4px 8px;font-size:13px}
.r2 .nm{flex:1;min-width:0}
.r2 .vl{font-variant-numeric:tabular-nums;color:var(--dim)}
.pg{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;display:block}
.pgwrap{max-height:520px;overflow:auto;border-radius:6px;border:1px solid var(--line)}
.back{margin-bottom:12px}
.hint{font-size:11px;color:var(--mute);margin:8px 0}
.mdsel{display:inline-flex;gap:4px}
.mdsel button{padding:5px 14px;border-radius:6px;font-size:13px}
.mdsel button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tr{background:#f8f9fb;border:1px solid var(--line);border-radius:6px;padding:10px 12px;
  font-size:12px;line-height:1.6;white-space:pre-wrap;font-family:ui-monospace,monospace;color:var(--dim)}
</style>
</head>
<body>
<nav>
  <a href="#/queue" data-r="queue">複核佇列</a>
  <a href="#/matrix" data-r="matrix">比較表</a>
  <a href="#/run" data-r="run">讀取</a>
  <button id="rebuildBtn" class="pri" style="margin-left:auto">⟳ 重建</button>
  <span class="muted" id="rebuildstat"></span>
  <a href="/workbench.html" class="muted">← 回 v3 工作台</a>
</nav>
<main id="app">載入中…</main>
<script src="v4.js"></script>
</body>
</html>
