<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>配置模擬器</title>
<link rel="stylesheet" href="/tokens.css">
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --panel2:#eef0f3; --line:#e9ebef;
  --fg:#111827; --dim:#5f6672; --mute:#8a919e; --accent:#4f46e5; --warn:#b45309;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,"Noto Sans TC",sans-serif}
nav{display:flex;align-items:center;gap:2px;background:var(--panel);
  border-bottom:1px solid var(--line);padding:0 12px;position:sticky;top:0;z-index:10;
  overflow-x:auto}
nav a{padding:11px 16px;color:var(--dim);text-decoration:none;font-size:13px;
  border-bottom:2px solid transparent;white-space:nowrap;flex:none}
nav a.on{color:var(--fg);border-bottom-color:var(--accent)}
nav .sp{margin-left:auto;font-size:12px;color:var(--mute);padding-right:4px}
main{padding:16px;max-width:1240px;margin:0 auto}
h1{font-size:17px;font-weight:500;margin:0 0 4px}
.sub{font-size:12px;color:var(--mute);margin:0 0 16px}

.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.grp{display:flex;align-items:center;gap:8px}
.grp .lbl{font-size:12px;color:var(--mute);white-space:nowrap}

/* 三態鈕 —— 沿用 tokens.css 的 .ix-seg 語彙 */
.ix-seg{display:inline-flex;background:var(--panel2);border-radius:8px;padding:2px}
.ix-seg button{border:none;background:transparent;font-size:12px;padding:6px 12px;
  cursor:pointer;color:var(--dim);border-radius:6px;font-family:inherit}
.ix-seg button.on{background:#fff;color:var(--fg);font-weight:600;
  box-shadow:0 1px 2px rgba(16,24,40,.08)}
.ix-seg button:disabled{opacity:.35;cursor:not-allowed}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:6px 12px;font-size:12px;cursor:pointer;color:var(--dim);
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;line-height:1.3}
.chip .n{font-weight:600;color:var(--fg)}
.chip .s{font-size:10px;color:var(--mute)}
.chip.sel{border-color:var(--accent);background:#eef0fd}
.chip.sel .n{color:var(--accent)}
.chip .ord{display:inline-block;width:14px;height:14px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:9px;line-height:14px;text-align:center;
  margin-right:4px}

.yr{display:flex;align-items:center;gap:8px;flex:1;min-width:220px}
.yr input[type=range]{flex:1}
.yr .yv{font-variant-numeric:tabular-nums;font-weight:600;min-width:38px}
.yr:disabled,.yr.off{opacity:.4}
#playBtn{border:1px solid var(--line);background:#fff;border-radius:6px;width:26px;height:26px;
  cursor:pointer;font-size:11px;color:var(--dim);flex:none}
#playBtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tgl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer;
  user-select:none}
.tgl input{cursor:pointer}
.tgl.off{opacity:.4;cursor:not-allowed}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:18px;margin-bottom:14px}
.hint{font-size:12px;color:var(--mute);margin:0 0 10px;line-height:1.7}
.hint b{color:var(--dim)}
svg{width:100%;max-width:900px;height:auto;overflow:visible;font-family:inherit;
  display:block;margin:0 auto}
.axlbl{font-size:12px;fill:var(--dim)}
.tick{font-size:10px;fill:var(--mute)}
.gridline{stroke:var(--line);stroke-width:1}
.bankname{font-size:11px;fill:var(--dim)}
.dot{stroke:#fff;stroke-width:1.5}
.dot.hollow{fill:#fff;stroke-width:2}
.arrow-line{stroke-width:2;fill:none;marker-end:url(#arrowhead)}
.dumbbell-line{stroke-width:2.5}
.traj-line{fill:none;stroke-width:1.5;opacity:.55}
.traj-dot{opacity:.45}
.svg3d{cursor:grab}
.svg3d.dragging{cursor:grabbing}
.axis3d{stroke:var(--mute);stroke-width:1}
/* 「往箭頭方向代表什麼」—— 比箭頭本身更重要,浮虧率那根的方向跟其餘軸相反 */
.moretag{font-size:10px;fill:var(--mute)}

/* 刻度與框線 —— 淡到不搶點,但一定要有數字(2軸圖原本完全沒有數字) */
.axisline{stroke:#c6cbd4;stroke-width:1}
.tickmark{stroke:#c6cbd4;stroke-width:1}
.refline{stroke:#b9bfc9;stroke-width:1;stroke-dasharray:4 4}
.reflbl{font-size:10px;fill:var(--mute)}

/* 3D 地板與投影線 —— 不是裝飾,是唯一能判讀「高 vs 遠」的線索 */
.floor{fill:#5f6672;fill-opacity:.07;stroke:#c6cbd4;stroke-width:1}
.dropline{stroke:#8a919e;stroke-width:1;stroke-dasharray:2 3;opacity:.5}
.dropdot{fill:#8a919e;opacity:.4}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-top:10px;
  align-items:center}
.legend .it{display:flex;align-items:center;gap:5px}
.legend .sw{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.legend .sw.hollow{background:#fff;border:2px solid var(--mute)}
/* 可點的銀行圖例 —— 點一下隱藏那家 */
.legend .it.bank{cursor:pointer;user-select:none;border:1px solid transparent;
  border-radius:99px;padding:3px 9px 3px 6px}
.legend .it.bank:hover{border-color:var(--line);background:#fafbfc}
.legend .it.bank.off{opacity:.4}
.legend .it.bank.off .sw{background:transparent!important;
  box-shadow:inset 0 0 0 2px currentColor}
.legend .it.bank.off span:last-child{text-decoration:line-through}
.legend .hintlet{color:var(--mute);font-size:10px}
.legend .allbtn{cursor:pointer;color:var(--accent);font-size:10px;
  border:none;background:none;padding:0;font-family:inherit}
.flagbox{font-size:11px;color:var(--mute);border-top:1px solid var(--line);
  margin-top:12px;padding-top:8px;line-height:1.8}
.empty{color:var(--mute);font-size:13px;padding:40px 0;text-align:center}

/* 定義選單 —— 每個選中的軸各一組,跟口徑鈕同一套 .ix-seg 語彙 */
.vgrp{display:flex;align-items:center;gap:8px}
.vgrp .vlbl{font-size:12px;color:var(--dim);font-weight:600;white-space:nowrap}
.lensnote{margin:-10px 0 16px}
.caveat{font-size:11px;color:var(--warn,#b45309);margin:4px 0 0;line-height:1.7}
</style>
</head>
<body>
<nav>
  <a href="/workbench.html">工作台</a>
  <a href="/sim.html" class="on">配置模擬器</a>
  <span class="sp" id="src"></span>
</nav>
<main>
  <h1>配置空間 —— 選軸即選圖</h1>
  <p class="sub">選幾根軸決定畫什麼圖；「看得到多少」只影響①信用②利率（③④本來就只有一種看法）。</p>

  <div class="bar">
    <div class="grp">
      <span class="lbl">看得到多少</span>
      <div class="ix-seg" id="lensSeg"></div>
    </div>
    <div class="grp yr">
      <span class="lbl">年底</span>
      <button id="playBtn" title="播放 2021→2025">▶</button>
      <input type="range" id="yearSlider" min="0" max="4" step="1" value="4">
      <span class="yv" id="yearVal">2025</span>
    </div>
    <label class="tgl" id="trajTgl">
      <input type="checkbox" id="trajChk" checked>
      顯示軌跡（5期連線，最新一期加粗）
    </label>
  </div>

  <p class="sub lensnote" id="lensNote"></p>

  <div class="bar">
    <span class="lbl">軸（最多三根，點第四根時最早選的退出）</span>
    <div class="chips" id="axisChips"></div>
  </div>

  <div class="bar" id="variantBar" style="display:none"></div>

  <div class="card">
    <p class="hint" id="plotHint"></p>
    <p class="caveat" id="caveat"></p>
    <div id="plotWrap"><div class="empty">選一根軸開始</div></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="flagbox" id="flags"></div>
</main>
<script src="sim.js"></script>
</body>
</html>
