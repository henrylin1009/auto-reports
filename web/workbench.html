<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台</title>
<link rel="stylesheet" href="/tokens.css">
<style>
/* 複核台專屬 —— 變數沿用分析頁的視覺語言(見 web/tokens.css),
   值改成同一組色階(白底/淺灰/靛紫),名字維持不變是為了不用改動下面每一條規則。
   見 docs/plan_ui_unify.md 步驟 3。 */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,"Noto Sans TC",sans-serif}
#rebuildBtn{margin-left:14px;font-size:12px;white-space:nowrap;flex:none}
#rebuildstat{font-size:11px;margin-left:8px;max-width:220px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;flex:none}
main{padding:16px;max-width:1240px}
.scroll{overflow-x:auto}
h1{font-size:17px;font-weight:500;margin:0 0 12px}
h2{font-size:14px;font-weight:500;margin:0}
button,select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;font-size:13px;font-family:inherit;cursor:pointer}
button:hover{border-color:#c6cbd4}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.dan{color:var(--danger)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar label{font-size:12px;color:var(--dim)}
.muted{color:var(--mute);font-size:12px}
.dim{color:var(--dim)}

/* 矩陣 */
.mx{border-collapse:separate;border-spacing:4px}
.mx th{font-size:11px;font-weight:400;color:var(--dim);padding:2px 6px;text-align:left}
.mx td{padding:0}
.cell{display:flex;flex-direction:column;gap:2px;width:104px;padding:7px 9px;
  border:1px solid var(--line);border-radius:7px;background:var(--panel);
  cursor:pointer;text-align:left;font:inherit}
.cell:hover{border-color:var(--accent)}
.cell .k{font-size:12px}
.cell .s{font-size:10px;color:var(--mute)}
.cell{width:120px}
.cell.pend{border-color:var(--warn)}
.cell.bad{border-color:var(--danger)}
.cell.none{opacity:.4;cursor:default;background:transparent}
.cell .s.warn{color:var(--warn)}
.bars{display:flex;gap:3px;margin-top:3px}
.bars i{height:3px;flex:1;border-radius:2px;background:var(--line)}
.bars i.g{background:var(--ok)} .bars i.w{background:var(--warn)}
.bars i.r{background:var(--danger)} .bars i.miss{background:#d8dbe1}

/* 複核 */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
/* 右欄(來源頁對照圖)固定在畫面上,左欄(逐列核對)自己滾——2026-07-30 使用者
   實測抓到:左欄一長,對到後面的列就把右邊的圖也捲走了,核對變成「捲上去看
   一眼、捲下來對數字」來回跑。sticky 讓右欄留在原地,左欄滾多遠都對得到圖。
   `top` 貼著 nav 底部(nav 實測 44.5px 高),`max-height`/`overflow` 讓右欄
   自己內容太長時(來源頁按鈕一多)也不會超出視窗高度。*/
.two .side{position:sticky;top:52px;max-height:calc(100vh - 60px);overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
.rows{margin:0}
.sec{position:sticky;top:0;background:var(--panel);z-index:1;display:flex;gap:8px;
  align-items:center;padding:7px 8px 5px;margin-top:6px;font-size:13px;
  border-bottom:1px solid var(--line)}
.sec .bk{margin-left:auto;font-size:11px}
.blk{font-size:11px;color:var(--mute);padding:8px 8px 3px}
/* 一格常常有 2~3 份 record(明細表二/三/四,各自一頁)。原本三份直接上下
   疊成一長條,人要捲很久才知道自己在看哪一張表 —— 改成分頁:一次只顯示
   一份,上面一排按鈕切換,切換同時右邊跳到那份的來源頁。*/
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.tabs button{font-size:12px;padding:4px 10px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer}
.row:hover{background:var(--panel2)}
.row.cur{background:#eef0fd;outline:1px solid var(--accent)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.row .vl{font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim)}
.row .bk{font-size:11px;color:var(--ok);min-width:66px;text-align:right}
.row.p .bk{color:var(--warn)}
.row .i{color:var(--mute);font-size:11px;cursor:pointer;padding:0 2px}
.bks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bks button{font-size:12px;padding:4px 9px}
.bks button b{color:var(--mute);font-weight:400;margin-right:4px}
.pg{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;display:block}
.pgwrap{max-height:460px;overflow:auto;border-radius:6px;border:1px solid var(--line)}
.tr{background:#f8f9fb;border:1px solid var(--line);border-radius:6px;padding:8px 10px;
  margin-top:8px;font-size:11px;color:var(--dim);white-space:pre-wrap;font-family:ui-monospace,monospace}
.tag{font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--mute)}
.tag.w{border-color:var(--warn);color:var(--warn)}
.demo{border:1px dashed var(--warn);color:var(--warn);font-size:11px;padding:2px 7px;border-radius:4px}
.hint{font-size:11px;color:var(--mute);margin-top:10px}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:10px}
code{background:var(--panel2);border-radius:3px;padding:1px 4px;font-size:12px;
  font-family:ui-monospace,monospace}

/* 統計列 */
.stats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:9px 16px;min-width:96px}
.stat b{display:block;font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--mute)}
.stat.w b{color:var(--warn)}
.cell.ok{border-color:var(--ok)}

/* 抄列的 JSON 編輯器 */
textarea{width:100%;height:430px;background:#f8f9fb;color:var(--fg);
  border:1px solid var(--line);border-radius:7px;padding:10px;resize:vertical;
  font:12px/1.55 ui-monospace,SFMono-Regular,monospace;tab-size:2}
textarea:focus{outline:none;border-color:var(--accent)}
.fl-row{display:flex;gap:10px;align-items:baseline;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12px}
.fl-row .fl-k{font-variant-numeric:tabular-nums;min-width:120px}
.fl-row .fl-s{min-width:52px;color:var(--dim)}
.fl-row.fl-absent .fl-s{color:var(--mute)}
.fl-row.fl-failed .fl-s{color:var(--danger)}
.fl-row .fl-t{color:var(--mute);min-width:120px}
.fl-row .fl-w{color:var(--mute);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.miss{border-style:dashed;color:var(--dim);background:transparent}
.cell.miss:hover{border-style:solid;border-color:var(--accent);color:var(--fg)}
.cell.miss:disabled{opacity:.35;cursor:default}
.cell.bad{border-color:var(--danger);color:var(--danger)}
.bsw{display:inline-flex;gap:4px;margin-left:10px;vertical-align:middle}
.bsw button{font-size:12px;padding:3px 11px}
.bkcols{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.bkcol{flex:0 0 190px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:8px}
.bkcol.loose{border-color:var(--danger)}
.bkcol h3{margin:0 0 7px;font-size:12px;font-weight:600;display:flex;
  justify-content:space-between;align-items:baseline;gap:6px}
.bkcol h3 span{color:var(--mute);font-weight:400;font-size:11px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:5px;
  padding:5px 7px;margin-bottom:5px;font-size:12px;line-height:1.35;cursor:grab}
.chip.prov{border-color:var(--warn);background:#fff7ec}
.chip.uncl{border-color:var(--danger);background:#fdecec}
.chip.drag{opacity:.4}
.chip b{font-weight:400;color:var(--mute);font-size:11px;margin-left:4px}
.bkcol.over{border-color:var(--accent);background:var(--panel2)}
.auto{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 8px}
.auto .hint{margin:0;flex:1;min-width:240px}
.autolog{background:#f8f9fb;border:1px solid var(--line);border-radius:6px;
  padding:10px 12px;margin:0 0 14px;max-height:260px;overflow:auto;
  font-size:12px;line-height:1.55;white-space:pre-wrap;color:var(--dim)}

.uploadzone{display:flex;flex-direction:column;gap:4px;align-items:flex-start;
  border:1.5px dashed var(--line);border-radius:8px;padding:12px 14px;
  margin:0 0 14px;transition:border-color .15s,background .15s}
.uploadzone.drag{border-color:var(--accent);background:var(--panel2)}
.uploadzone .hint{margin:0}
.uplabel{color:var(--accent);cursor:pointer;text-decoration:underline}

/* v4 複核頁元件 */
.badge{font-size:11px;padding:2px 7px;border-radius:4px;border:1px solid;display:inline-block}
.badge.RED{color:var(--danger);border-color:var(--danger);background:#fff8f8}
.badge.GREY{color:var(--dim);border-color:var(--line);background:#f5f6f8}
.badge.GREEN{color:var(--ok);border-color:var(--ok);background:#f0fdf4}
.mdsel{display:inline-flex;gap:4px}
.mdsel button{padding:4px 13px;border-radius:6px;font-size:13px}
.mdsel button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.wcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px}
.wcard h3{margin:0 0 8px;font-size:13px;font-weight:500}
.w{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px}
.w .name{color:var(--dim);min-width:140px}
.w.OK .st{color:var(--ok);font-weight:500}
.w.MISMATCH .st{color:var(--danger);font-weight:500}
.w.no_witness .st{color:var(--mute)}
.w .diff{font-size:11px;color:var(--warn);font-variant-numeric:tabular-nums}
.w .wn{font-size:11px;color:var(--mute);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v4q-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;
  background:var(--panel);border:1px solid var(--line);margin-bottom:6px;cursor:pointer}
.v4q-row:hover{border-color:var(--accent)}
.v4q-row .doc{font-size:11px;color:var(--mute);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="appnav"></div>
<script src="appnav.js"></script>
<script>
// 右側狀態區:重建鈕與狀態文字掛進共用導覽列的 .slot(這頁專屬,不進 appnav.js)
(function(){var s=document.getElementById("navslot");if(!s)return;
 s.insertAdjacentHTML("beforeend",
   '<button id="rebuildBtn" class="pri">⟳ 重建</button>'+
   '<span class="muted" id="rebuildstat"></span><span id="navstat"></span>');})();
</script>
<main id="app">載入中…</main>
<script src="workbench.js"></script>
</body>
</html>
