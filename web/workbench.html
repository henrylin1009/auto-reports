<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台</title>
<style>
:root{
  --bg:#0b0d10; --panel:#14171b; --panel2:#1a1e24; --line:#2a2d33;
  --fg:#e5e7eb; --dim:#9ca3af; --mute:#6b7280;
  --ok:#4ade80; --warn:#facc15; --accent:#60a5fa; --danger:#f87171;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,"Noto Sans TC",sans-serif}
nav{display:flex;align-items:center;gap:2px;background:var(--panel);
  border-bottom:1px solid var(--line);padding:0 12px}
nav a{padding:11px 16px;color:var(--dim);text-decoration:none;font-size:13px;
  border-bottom:2px solid transparent}
nav a.on{color:var(--fg);border-bottom-color:var(--accent)}
nav .sp{margin-left:auto;font-size:12px;color:var(--mute);padding-right:4px}
main{padding:16px;max-width:1240px}
.scroll{overflow-x:auto}
h1{font-size:17px;font-weight:500;margin:0 0 12px}
h2{font-size:14px;font-weight:500;margin:0}
button,select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;font-size:13px;font-family:inherit;cursor:pointer}
button:hover{border-color:#3d424a}
button.pri{background:#1d4ed8;border-color:#1d4ed8}
button.dan{color:var(--danger)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar label{font-size:12px;color:var(--dim)}
.muted{color:var(--mute);font-size:12px}
.dim{color:var(--dim)}

/* 矩陣 */
.mx{border-collapse:separate;border-spacing:4px}
.mx th{font-size:11px;font-weight:400;color:var(--dim);padding:2px 6px;text-align:left}
.mx td{padding:0}
.cell{display:flex;flex-direction:column;gap:2px;width:104px;padding:7px 9px;
  border:1px solid var(--line);border-radius:7px;background:var(--panel);
  cursor:pointer;text-align:left;font:inherit}
.cell:hover{border-color:var(--accent)}
.cell .k{font-size:12px}
.cell .s{font-size:10px;color:var(--mute)}
.cell{width:120px}
.cell.pend{border-color:#4a3f18}
.cell.bad{border-color:#4a2020}
.cell.none{opacity:.28;cursor:default;background:transparent}
.cell .s.warn{color:var(--warn)}
.bars{display:flex;gap:3px;margin-top:3px}
.bars i{height:3px;flex:1;border-radius:2px;background:var(--line)}
.bars i.g{background:var(--ok)} .bars i.w{background:var(--warn)}
.bars i.r{background:var(--danger)} .bars i.miss{background:#33373d}

/* 複核 */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.rows{margin:0}
.sec{position:sticky;top:0;background:var(--panel);z-index:1;display:flex;gap:8px;
  align-items:center;padding:7px 8px 5px;margin-top:6px;font-size:13px;
  border-bottom:1px solid var(--line)}
.sec .bk{margin-left:auto;font-size:11px}
.blk{font-size:11px;color:var(--mute);padding:8px 8px 3px}
.row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer}
.row:hover{background:var(--panel2)}
.row.cur{background:#1b2431;outline:1px solid var(--accent)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.row .vl{font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim)}
.row .bk{font-size:11px;color:var(--ok);min-width:66px;text-align:right}
.row.p .bk{color:var(--warn)}
.row .i{color:var(--mute);font-size:11px;cursor:pointer;padding:0 2px}
.bks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bks button{font-size:12px;padding:4px 9px}
.bks button b{color:var(--mute);font-weight:400;margin-right:4px}
.pg{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;display:block}
.pgwrap{max-height:460px;overflow:auto;border-radius:6px}
.tr{background:#0f1216;border:1px solid var(--line);border-radius:6px;padding:8px 10px;
  margin-top:8px;font-size:11px;color:var(--dim);white-space:pre-wrap;font-family:ui-monospace,monospace}
.tag{font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--mute)}
.demo{border:1px dashed var(--warn);color:var(--warn);font-size:11px;padding:2px 7px;border-radius:4px}
.hint{font-size:11px;color:var(--mute);margin-top:10px}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:10px}
code{background:var(--panel2);border-radius:3px;padding:1px 4px;font-size:12px;
  font-family:ui-monospace,monospace}

/* 統計列 */
.stats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:9px 16px;min-width:96px}
.stat b{display:block;font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--mute)}
.stat.w b{color:var(--warn)}
.cell.ok{border-color:#1f3d2a}

/* 抄列的 JSON 編輯器 */
textarea{width:100%;height:430px;background:#0f1216;color:var(--fg);
  border:1px solid var(--line);border-radius:7px;padding:10px;resize:vertical;
  font:12px/1.55 ui-monospace,SFMono-Regular,monospace;tab-size:2}
textarea:focus{outline:none;border-color:var(--accent)}
.bsw{display:inline-flex;gap:4px;margin-left:10px;vertical-align:middle}
.bsw button{font-size:12px;padding:3px 11px}
.bkcols{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.bkcol{flex:0 0 190px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:8px}
.bkcol.loose{border-color:var(--danger)}
.bkcol h3{margin:0 0 7px;font-size:12px;font-weight:600;display:flex;
  justify-content:space-between;align-items:baseline;gap:6px}
.bkcol h3 span{color:var(--mute);font-weight:400;font-size:11px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:5px;
  padding:5px 7px;margin-bottom:5px;font-size:12px;line-height:1.35;cursor:grab}
.chip.prov{border-color:#8a6d1f;background:#221c0d}
.chip.uncl{border-color:var(--danger);background:#2a1315}
.chip.drag{opacity:.4}
.chip b{font-weight:400;color:var(--mute);font-size:11px;margin-left:4px}
.bkcol.over{border-color:var(--accent);background:var(--panel2)}
.auto{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 8px}
.auto .hint{margin:0;flex:1;min-width:240px}
.autolog{background:#0c0e12;border:1px solid var(--line);border-radius:6px;
  padding:10px 12px;margin:0 0 14px;max-height:260px;overflow:auto;
  font-size:12px;line-height:1.55;white-space:pre-wrap;color:var(--dim)}
</style>
</head>
<body>
<nav>
  <a href="#/matrix" data-r="matrix">總覽</a>
  <a href="#/buckets" data-r="buckets">分桶</a>
  <span class="sp" id="navstat"></span>
</nav>
<main id="app">載入中…</main>
<script src="workbench.js"></script>
</body>
</html>
