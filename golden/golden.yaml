# 黃金集正確答案(P0)——本檔是全部重構的驗收依據,請人工開 PDF 核對後填寫。
#
# 單位一律【仟元】,與財報同。填整數,不要逗號。
# 頁碼註解是 1-based(PDF 閱讀器看到的頁)。
#
# 欄位說明:
#   total       表最末【印出的總計】(含衍生),例:「透過損益按公允價值衡量之金融資產 $122,605,853」
#   bs_anchor   資產負債表【資產側】該科目的當期金額
#   buckets     逐桶金額,【不含衍生】(只有標 bucket_blind 的 4 份要填)
#   deriv       衍生金融資產小計(不入桶,但算進 total)。沒有衍生段就填 0
#   verdict     ok = 人工讀得出來 / unreadable = 資訊已毀,任何模型都讀不出(這也是有效答案)
#
# ★★ 財報【不會】照我們的 9 桶印,要做會計意義的對應。實例(富邦 2022H1 主附註 p40):
#
#     商業本票        31,149,443  → 貨幣市場
#     可轉換公司債     21,757,691  ┐ 兩列併一桶
#     公司債           5,179,127  ┘ → 公司債 = 26,936,818
#     可轉讓定期存單    6,308,512  → 可轉讓定存單
#     政府公債         4,528,895  → 公債
#     其他             6,419,339  → 其他
#     小計            75,343,007  ← 這個 = 8 個桶的總和
#     衍生金融資產小計  47,262,846  ← deriv,不入桶
#     印出的總計      122,605,853  ← total
#
#   常見對應:多列併一桶(可轉換公司債+公司債)、整段不入桶(衍生/評價調整/備抵/減損/
#   應計利息/未攤銷溢折價)、沒有的桶填 0(不要留空)。受益憑證=股票,受益證券=資產基礎(一字之差,兩種商品)。
#
# ✅ 自檢(填完務必驗,能抓到自己的抄寫錯誤):  sum(buckets) + deriv == total
#
# ⚠ 填寫紀律:
#   1. buckets 一律【盲抄】——不要看 extract_v2_results.json,不要看網站。看了這把尺就失效。
#   2. 預填的數字是「明細表與 BS 兩個獨立來源一致」的值,瞄一眼確認即可;
#      標 __FILL__ 的是【兩來源不一致】,必須人判,註解裡有兩個候選值。
#   3. 真的判不出來 → 填 verdict: unreadable,不要猜。

